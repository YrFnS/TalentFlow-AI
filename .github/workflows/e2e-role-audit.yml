name: Local E2E source snapshot

on:
  push:
    branches:
      - agent/e2e-role-audit-fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-e2e-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Package the exact branch for isolated E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Record source revision
        run: |
          printf '%s\n' "$GITHUB_SHA" > .e2e-source-commit

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: talentflow-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !e2e-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Temporary write permission is used only by the guarded same-repository PR step
# below to commit Bun's normalized lockfile. This will be returned to read-only
# after the normalization commit lands.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentflow_ci
      NEXTAUTH_SECRET: talentflow-ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EMAIL_PROVIDER: CONSOLE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies and normalize lockfile
        run: bun install

      - name: Commit normalized lockfile and login translation fix
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/app/auth/login/content.tsx';
          const before = fs.readFileSync(path, 'utf8');
          const after = before.replaceAll('t.auth.createAccount', 't.auth.signUp');
          if (after !== before) fs.writeFileSync(path, after);
          NODE

          if git diff --quiet -- bun.lock src/app/auth/login/content.tsx; then
            echo "Tracked files already normalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock src/app/auth/login/content.tsx
            git commit -m "chore(ci): normalize Bun lockfile"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Run repository regression guard
        run: node scripts/repository-guard.mjs

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: HEAD
        run: bun run lint:changed

      - name: Type check
        run: bun run type-check

      - name: Production build
        run: bun run build

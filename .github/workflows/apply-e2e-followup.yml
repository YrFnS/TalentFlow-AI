name: Apply E2E follow-up patch

on:
  push:
    branches:
      - agent/e2e-role-audit-fixes
    paths:
      - .github/workflows/apply-e2e-followup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/e2e-role-audit-fixes
          fetch-depth: 0

      - name: Apply verified follow-up fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/e2e-production.cjs')
          s = p.read_text()
          s = s.replace(
          """function isErrorBoundaryBody(text) {
            return /application error: a client-side exception/i.test(text)
              || /internal server error/i.test(text)
              || /something went wrong(?:\\.|!|\\n|$)/i.test(text)
              || /unexpected application error/i.test(text);
          }
          """,
          """function isAccessDeniedBody(text) {
            return /403\\s*-\\s*access denied/i.test(text)
              || /you (?:do not|don't) have permission to access this page/i.test(text);
          }

          function isErrorBoundaryBody(text) {
            return /application error: a client-side exception/i.test(text)
              || /internal server error/i.test(text)
              || /something went wrong(?:\\.|!|\\n|$)/i.test(text)
              || /unexpected application error/i.test(text);
          }
          """)
          s = s.replace(
          """  page.on('console', (message) => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (/favicon\\.ico/i.test(text)) return;
              entries.push({ type: 'console-error', message: text, url: page.url() });
            });

            page.on('response', (response) => {
              if (!sameOrigin(response.url())) return;
              if (response.status() < 500) return;
              entries.push({
                type: 'http-5xx',
                status: response.status(),
                method: response.request().method(),
                url: response.url(),
              });
            });
          """,
          """  page.on('console', (message) => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (/favicon\\.ico/i.test(text)) return;
              if (/failed to load resource: the server responded with a status of [45]\\d\\d/i.test(text)) return;
              const location = message.location();
              entries.push({
                type: 'console-error',
                message: text,
                pageUrl: page.url(),
                url: location.url || page.url(),
                lineNumber: location.lineNumber,
                columnNumber: location.columnNumber,
              });
            });

            page.on('response', (response) => {
              if (!sameOrigin(response.url())) return;
              if (response.status() < 400) return;
              entries.push({
                type: response.status() >= 500 ? 'http-5xx' : 'http-4xx',
                status: response.status(),
                method: response.request().method(),
                resourceType: response.request().resourceType(),
                url: response.url(),
              });
            });
          """)
          s = s.replace(
          """    notFound: isNotFoundBody(bodyText),
              errorBoundary: isErrorBoundaryBody(bodyText),
          """,
          """    notFound: isNotFoundBody(bodyText),
              accessDeniedBody: isAccessDeniedBody(bodyText),
              errorBoundary: isErrorBoundaryBody(bodyText),
          """)
          old = """  if (state.horizontalOverflow) {
              addIssue('warning', scope, `Horizontal overflow detected for ${route}`, state.metrics);
            }

            for (const entry of diagnosticEntries) {
              if (entry.type === 'pageerror' || entry.type === 'http-5xx') {
                addIssue('high', scope, `${entry.type} while loading ${route}`, entry);
              } else if (entry.type === 'console-error' || entry.type === 'request-failed') {
                addIssue('warning', scope, `${entry.type} while loading ${route}`, entry);
              }
            }

            if (options.expectedPath) {
          """
          new = """  const denied = Boolean(
              options.expectDenied && (
                state.accessDeniedBody
                || state.notFound
                || state.status === 401
                || state.status === 403
                || state.status === 404
                || state.finalPath.startsWith('/auth/login')
                || state.finalPath === '/not-found'
              )
            );

            if (state.horizontalOverflow && !denied) {
              addIssue('warning', scope, `Horizontal overflow detected for ${route}`, state.metrics);
            }

            for (const entry of diagnosticEntries) {
              const expectedDeniedDocument = denied
                && entry.type === 'http-4xx'
                && [401, 403, 404].includes(entry.status)
                && entry.resourceType === 'document';
              if (expectedDeniedDocument) continue;

              if (entry.type === 'pageerror' || entry.type === 'http-5xx') {
                addIssue('high', scope, `${entry.type} while loading ${route}`, entry);
              } else if (entry.type === 'http-4xx' || entry.type === 'console-error' || entry.type === 'request-failed') {
                addIssue('warning', scope, `${entry.type} while loading ${route}`, entry);
              }
            }

            if (options.expectedPath) {
          """
          if old not in s:
              raise SystemExit('role diagnostic block not found')
          s = s.replace(old, new)
          old = """  if (options.expectDenied) {
              const denied = state.notFound
                || state.status === 401
                || state.status === 403
                || state.finalPath.startsWith('/auth/login')
                || state.finalPath === '/not-found';
              result.accessDenied = denied;
              if (!denied) {
          """
          new = """  if (options.expectDenied) {
              result.accessDenied = denied;
              if (!denied) {
          """
          if old not in s:
              raise SystemExit('role denied block not found')
          p.write_text(s.replace(old, new))

          p = Path('scripts/e2e-critical-flows.cjs')
          s = p.read_text()
          old = """  await goto(page, `/auth/register?callbackUrl=${encodeURIComponent(callbackPath)}`);

            const candidateOnlyVisible = await page
          """
          new = """  await goto(page, `/auth/register?callbackUrl=${encodeURIComponent(callbackPath)}`);
            await page.locator('#name').waitFor({ state: 'visible', timeout: 15_000 });

            const candidateOnlyVisible = await page
          """
          if old not in s:
              raise SystemExit('registration navigation block not found')
          s = s.replace(old, new)
          s = s.replace(
          """  await page.getByRole('button', { name: 'Create account', exact: true }).click();
          """,
          """  const submitButton = page.locator('button[type="submit"]');
            const submitButtonText = (await submitButton.innerText()).trim();
            await submitButton.click();
          """)
          s = s.replace(
          """    candidateOnlyVisible,
              forbiddenRoleChoices,
          """,
          """    candidateOnlyVisible,
              submitButtonText,
              forbiddenRoleChoices,
          """)
          p.write_text(s)

          p = Path('src/components/ui/sidebar.tsx')
          s = p.read_text()
          old = '"bg-background relative flex w-full flex-1 flex-col",'
          new = '"bg-background relative flex min-w-0 w-full flex-1 flex-col overflow-x-hidden",'
          if old not in s:
              raise SystemExit('sidebar inset block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/app/(admin)/layout.tsx')
          s = p.read_text()
          old = '<main className="flex-1 overflow-auto p-4 lg:p-6">'
          new = '<main className="min-w-0 flex-1 overflow-y-auto overflow-x-hidden p-4 lg:p-6">'
          if old not in s:
              raise SystemExit('admin main block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/app/(admin)/admin/users/page.tsx')
          s = p.read_text()
          s = s.replace('<div className="space-y-6">', '<div className="min-w-0 max-w-full space-y-6">', 1)
          old = '''      {/* Users Table */}\n      <Card>'''
          new = '''      {/* Users Table */}\n      <Card className="min-w-0 max-w-full overflow-hidden">'''
          if old not in s:
              raise SystemExit('users card block not found')
          s = s.replace(old, new, 1)
          old = '''        <CardContent>\n          <div className="overflow-x-auto">\n            <Table>'''
          new = '''        <CardContent className="min-w-0 max-w-full">\n          <div className="min-w-0 max-w-full overflow-x-auto">\n            <Table className="min-w-[1024px]">'''
          if old not in s:
              raise SystemExit('users table block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          node --check scripts/e2e-production.cjs
          node --check scripts/e2e-critical-flows.cjs

      - name: Commit follow-up fixes
        shell: bash
        run: |
          git config user.name "TalentFlow E2E Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/e2e-production.cjs scripts/e2e-critical-flows.cjs \
            src/components/ui/sidebar.tsx src/app/'(admin)'/layout.tsx \
            src/app/'(admin)'/admin/users/page.tsx
          git commit -m "test: distinguish denied routes and contain admin tables"
          git push origin HEAD:agent/e2e-role-audit-fixes

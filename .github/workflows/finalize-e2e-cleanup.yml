name: Finalize E2E cleanup

on:
  push:
    branches:
      - agent/e2e-role-audit-fixes
    paths:
      - .github/workflows/finalize-e2e-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/e2e-role-audit-fixes
          fetch-depth: 0

      - name: Improve diagnostics and remove temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/e2e-critical-flows.cjs')
          source = path.read_text()

          old = '''  page.on('console', (message) => {\n    if (message.type() !== 'error') return;\n    const text = message.text();\n    if (/favicon\\.ico/i.test(text)) return;\n    entries.push({ type: 'console-error', url: page.url(), message: text });\n  });\n\n  page.on('response', (response) => {\n    try {\n      if (new URL(response.url()).origin !== new URL(BASE_URL).origin) return;\n      if (response.status() < 500) return;\n      entries.push({\n        type: 'http-5xx',\n        url: response.url(),\n        status: response.status(),\n        method: response.request().method(),\n      });\n    } catch {\n      // Ignore malformed URLs from browser internals.\n    }\n  });\n'''

          new = '''  page.on('console', (message) => {\n    if (message.type() !== 'error') return;\n    const text = message.text();\n    if (/favicon\\.ico/i.test(text)) return;\n    // Chromium emits a generic message for failed resources. The response\n    // listener below records the actionable URL, status, and resource type.\n    if (/failed to load resource: the server responded with a status of [45]\\d\\d/i.test(text)) return;\n    const location = message.location();\n    entries.push({\n      type: 'console-error',\n      pageUrl: page.url(),\n      url: location.url || page.url(),\n      lineNumber: location.lineNumber,\n      columnNumber: location.columnNumber,\n      message: text,\n    });\n  });\n\n  page.on('response', (response) => {\n    try {\n      if (new URL(response.url()).origin !== new URL(BASE_URL).origin) return;\n      if (response.status() < 400) return;\n      entries.push({\n        type: response.status() >= 500 ? 'http-5xx' : 'http-4xx',\n        url: response.url(),\n        status: response.status(),\n        method: response.request().method(),\n        resourceType: response.request().resourceType(),\n        pageUrl: page.url(),\n      });\n    } catch {\n      // Ignore malformed URLs from browser internals.\n    }\n  });\n'''

          if old not in source:
              raise SystemExit('critical diagnostics block not found')
          source = source.replace(old, new, 1)
          path.write_text(source)

          for temporary in (
              '.github/workflows/e2e-role-audit.yml',
              '.github/workflows/resolve-e2e-endpoint.yml',
              '.github/workflows/finalize-e2e-cleanup.yml',
          ):
              candidate = Path(temporary)
              if candidate.exists():
                  candidate.unlink()
          PY

          node --check scripts/e2e-critical-flows.cjs

      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "TalentFlow E2E Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: retain actionable isolated E2E diagnostics"
          git push origin HEAD:agent/e2e-role-audit-fixes

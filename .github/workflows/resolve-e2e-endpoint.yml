name: Resolve isolated E2E endpoint

on:
  push:
    branches:
      - agent/e2e-role-audit-fixes
    paths:
      - .github/workflows/resolve-e2e-endpoint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Neon endpoint
        shell: bash
        run: |
          python - <<'PY' > neon-endpoint.txt
          import socket

          host = "ep-old-river-alnubliy-pooler.c-3.eu-central-1.aws.neon.tech"
          addresses = sorted({
              item[4][0]
              for item in socket.getaddrinfo(host, 5432, type=socket.SOCK_STREAM)
              if ":" not in item[4][0]
          })
          if not addresses:
              raise SystemExit("No IPv4 address resolved")
          print(host)
          for address in addresses:
              print(address)
          PY
          cat neon-endpoint.txt

      - name: Upload resolution
        uses: actions/upload-artifact@v4
        with:
          name: talentflow-neon-endpoint
          path: neon-endpoint.txt
          if-no-files-found: error
          retention-days: 1

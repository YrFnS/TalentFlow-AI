name: Apply final E2E fixes

on:
  push:
    branches:
      - agent/e2e-role-audit-fixes
    paths:
      - .github/workflows/apply-final-e2e-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/e2e-role-audit-fixes
          fetch-depth: 0

      - name: Remove invalid candidate navigation and harden validation test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/(candidate)/layout.tsx')
          s = p.read_text()
          invalid_item = '''\t{\n\t\ttitleKey: "takeAssessment",\n\t\thref: "/candidate/take-assessment",\n\t\ticon: Award,\n\t},\n'''
          if invalid_item not in s:
              raise SystemExit('invalid candidate navigation item not found')
          p.write_text(s.replace(invalid_item, '', 1))

          p = Path('scripts/e2e-critical-flows.cjs')
          s = p.read_text()
          old = '''  const submitButton = page.locator('button[type="submit"]');\n  const submitButtonText = (await submitButton.innerText()).trim();\n  await submitButton.click();\n  const invalidFields = {\n    name: await page.locator('#name').getAttribute('aria-invalid'),\n    email: await page.locator('#email').getAttribute('aria-invalid'),\n    password: await page.locator('#password').getAttribute('aria-invalid'),\n    confirmPassword: await page.locator('#confirm-password').getAttribute('aria-invalid'),\n  };\n'''
          new = '''  await page.locator('#name').fill('A');\n  await page.locator('#email').fill('not-an-email');\n  await page.locator('#password').fill('weak');\n  await page.locator('#confirm-password').fill('different');\n\n  const submitButton = page.locator('button[type="submit"]');\n  const submitButtonText = (await submitButton.innerText()).trim();\n  await submitButton.click();\n  await page.waitForTimeout(250);\n\n  const invalidFields = await page.evaluate(() => {\n    const read = (id) => {\n      const element = document.getElementById(id);\n      return {\n        present: Boolean(element),\n        ariaInvalid: element?.getAttribute('aria-invalid') || null,\n      };\n    };\n    return {\n      name: read('name'),\n      email: read('email'),\n      password: read('password'),\n      confirmPassword: read('confirm-password'),\n    };\n  });\n'''
          if old not in s:
              raise SystemExit('registration field assertion block not found')
          s = s.replace(old, new, 1)
          old = '''    Object.values(invalidFields).every((value) => value === 'true'),\n'''
          new = '''    Object.values(invalidFields).every(\n      (value) => value.present && value.ariaInvalid === 'true',\n    ),\n'''
          if old not in s:
              raise SystemExit('registration validation assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY

          node --check scripts/e2e-critical-flows.cjs

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "TalentFlow E2E Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/'(candidate)'/layout.tsx scripts/e2e-critical-flows.cjs
          git commit -m "fix: remove invalid assessment link and stabilize validation audit"
          git push origin HEAD:agent/e2e-role-audit-fixes
